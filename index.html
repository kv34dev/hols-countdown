<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تايمر العطلة</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.cdnfonts.com/css/ds-digital" rel="stylesheet">

<style>
    body {
        margin: 0;
        padding: 20px 10px;
        background: #000000;
        font-family: 'DS-Digital', monospace;
        color: #ff0000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        text-align: center;
        box-sizing: border-box;
    }

    .title {
        font-size: 3em;
        color: #ff0000;
        margin-bottom: 40px;
        text-shadow: 0 0 20px #ff0000;
        max-width: 100%;
        word-wrap: break-word;
    }

    .timer {
        font-size: 4.5em;
        color: #ff0000;
        text-shadow: 0 0 25px #ff0000, 0 0 50px #ff0000;
        letter-spacing: 6px;
        padding: 20px 40px;
        border: 3px solid #ff0000;
        border-radius: 10px;
        box-shadow: 0 0 20px #ff0000 inset, 0 0 20px #ff0000;
        max-width: 100%;
        overflow: hidden;
    }

    .label {
        margin-top: 25px;
        font-size: 1.6em;
        color: #ff0000;
        opacity: 0.8;
        text-shadow: 0 0 15px #ff0000;
        max-width: 100%;
    }

    @media (max-width: 480px) {
        .title {
            font-size: 2em;
        }

        .timer {
            font-size: 2.5em;
            letter-spacing: 3px;
            padding: 15px 25px;
        }

        .label {
            font-size: 1.2em;
        }
    }

    @media (max-width: 360px) {
        .title {
            font-size: 1.7em;
        }

        .timer {
            font-size: 2em;
            padding: 10px 20px;
        }

        .label {
            font-size: 1em;
        }
    }
</style>
</head>
<body>

<div class="title">الوقت المتبقي حتى العطلة:</div>

<div class="timer" id="timer">00:00:00:00</div>
<div class="label">أيام : ساعات : دقائق : ثوان</div>

<script>
function updateTimer() {
    const targetDate = new Date("2025-12-20T00:00:00");
    const now = new Date();
    const diff = targetDate - now;

    if (diff <= 0) {
        document.getElementById("timer").textContent = "انتهى الوقت!";
        return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    document.getElementById("timer").textContent =
        `${String(days).padStart(2, '0')}:` +
        `${String(hours).padStart(2, '0')}:` +
        `${String(minutes).padStart(2, '0')}:` +
        `${String(seconds).padStart(2, '0')}`;
}

setInterval(updateTimer, 1000);
updateTimer();
</script>

</body>
</html>
